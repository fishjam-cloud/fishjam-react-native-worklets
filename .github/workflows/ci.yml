name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn test
      - run: yarn build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn expo prebuild --platform android --clean --no-install
        working-directory: example
      - run: ./gradlew :app:assembleDebug -PreactNativeArchitectures=arm64-v8a
        working-directory: example/android

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn expo prebuild --platform ios --clean --no-install
        working-directory: example
      - run: pod install
        working-directory: example/ios
      - run: >
          xcodebuild
          -workspace FishjamWorkletsExample.xcworkspace
          -scheme FishjamWorkletsExample
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
        working-directory: example/ios
